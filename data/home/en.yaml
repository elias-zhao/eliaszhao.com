sections:
  - hero
  - { type: cards, key: columns }
  - { type: cards, key: explore }

hero:
  align: start
  image: { src: img/avatar.png, alt: Yang Zhao }
  media:
    ratio: "1fr 240px"
    max_width: "216px"
  title_lines:
    - words: [{ text: Yang Zhao (eliaszhao) }]
  lead: Former Tencent Database Expert | Quant Researcher | Full-Stack Engineer | Infrastructure Architect | AI Practitioner
  actions:
    - { label: About me, url: about/, icon: fa-solid fa-user, style: primary }
    - { label: Card, url: card/, icon: fa-solid fa-address-card, style: ghost }

columns:
  eyebrow: Columns
  title: Core Areas
  columns: 3
  items:
    - title: Database Expert
      desc: Architecture, performance tuning, high availability, and incident reviews for MySQL, TDSQL, TiDB, and OceanBase.
      icon: fa-solid fa-database
      url: db/
    - title: Quant Researcher
      desc: Quantitative strategy research, data pipelines, backtesting frameworks, and trading systems.
      icon: fa-solid fa-chart-line
      url: quant/
    - title: AI Practitioner
      desc: AI agents, vibe coding, automation workflows, and full-stack product engineering.
      icon: fa-solid fa-robot
      url: ai/
    - title: Infrastructure Architect
      desc: Linux systems, servers, virtualization, storage, networking, and Homelab infrastructure.
      icon: fa-solid fa-server
      url: infra/
    - title: Slices of the World
      desc: Moments captured across travels, mountains, light, and everyday life.
      icon: fa-solid fa-camera-retro
      url: slices/

explore:
  eyebrow: More
  title: Dossier & Index
  columns: 3
  items:
    - { title: About, desc: Who I am, what I specialize in, and what I am building., icon: fa-solid fa-user, url: about/ }
    - { title: Resume, desc: Experience, skills, and selected projects., icon: fa-solid fa-id-card, url: resume/ }
    - { title: Articles, desc: Technical notes, ideas, and long-term writing., icon: fa-solid fa-pen-nib, url: posts/ }
