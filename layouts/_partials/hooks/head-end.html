{{- if .IsHome -}}
<style>
  .td-landing-hero {
    min-height: clamp(500px, 60vh, 620px);
    align-items: center;
    padding-block: clamp(80px, 9vw, 128px);
    background-image:
      linear-gradient(180deg, rgba(247, 246, 243, 0.14) 0%, rgba(247, 246, 243, 0.08) 72%, rgba(247, 246, 243, 0.96) 100%),
      linear-gradient(90deg, rgba(247, 246, 243, 0.86) 0%, rgba(247, 246, 243, 0.64) 48%, rgba(247, 246, 243, 0.18) 100%),
      url('/img/hero-bg.jpg');
    background-size: cover;
    background-position: center 48%;
    background-repeat: no-repeat;
  }

  [data-bs-theme='dark'] .td-landing-hero {
    background-image:
      linear-gradient(180deg, rgba(22, 21, 19, 0.22) 0%, rgba(22, 21, 19, 0.14) 72%, rgba(22, 21, 19, 0.96) 100%),
      linear-gradient(90deg, rgba(22, 21, 19, 0.86) 0%, rgba(22, 21, 19, 0.64) 48%, rgba(22, 21, 19, 0.24) 100%),
      url('/img/hero-bg.jpg');
  }

  .td-landing-hero .td-landing-hero__media {
    border-radius: 50%;
    transform: none;
    background-size: 112%;
    background-position: center 22%;
    border: 4px solid rgba(255, 255, 255, 0.92);
    box-shadow: 0 18px 42px rgba(15, 35, 55, 0.22);
  }

  [data-bs-theme='dark'] .td-landing-hero .td-landing-hero__media {
    border-color: rgba(255, 255, 255, 0.24);
    box-shadow: 0 18px 46px rgba(0, 0, 0, 0.55);
  }
</style>
{{- end -}}
