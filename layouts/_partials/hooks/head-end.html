{{- if .IsHome -}}
<style>
  .td-landing-hero {
    background-image:
      linear-gradient(180deg, rgba(247, 246, 243, 0.25) 0%, rgba(247, 246, 243, 0.15) 68%, rgba(247, 246, 243, 0.96) 100%),
      linear-gradient(90deg, rgba(247, 246, 243, 0.88) 0%, rgba(247, 246, 243, 0.72) 56%, rgba(247, 246, 243, 0.34) 100%),
      url('/img/hero-bg.jpg');
    background-size: cover;
    background-position: center 42%;
    background-repeat: no-repeat;
  }

  [data-bs-theme='dark'] .td-landing-hero {
    background-image:
      linear-gradient(180deg, rgba(22, 21, 19, 0.32) 0%, rgba(22, 21, 19, 0.22) 68%, rgba(22, 21, 19, 0.96) 100%),
      linear-gradient(90deg, rgba(22, 21, 19, 0.88) 0%, rgba(22, 21, 19, 0.72) 56%, rgba(22, 21, 19, 0.38) 100%),
      url('/img/hero-bg.jpg');
  }

  .td-landing-hero .td-landing-hero__media {
    border-radius: 50%;
    transform: none;
    background-size: 112%;
    background-position: center 22%;
    border: 4px solid rgba(255, 255, 255, 0.92);
    box-shadow: 0 18px 42px rgba(15, 35, 55, 0.22);
  }

  [data-bs-theme='dark'] .td-landing-hero .td-landing-hero__media {
    border-color: rgba(255, 255, 255, 0.24);
    box-shadow: 0 18px 46px rgba(0, 0, 0, 0.55);
