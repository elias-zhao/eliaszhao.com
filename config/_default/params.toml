colorScheme = "ocean"
# 首页使用浅色抽象背景，与个人名片形成更轻盈的第一印象。
defaultAppearance = "light"
autoSwitchAppearance = false
enableSearch = true
enableCodeCopy = true
mainSections = ["posts"]

# 与首页背景图配套使用固定、半透明的导航栏。它会为导航预留 148px，
# 使头像区从导航下方开始，而不是紧贴页面顶端。
[header]
  layout = "fixed-fill-blur"

[homepage]
  # 简洁的个人名片与最近文章；完整介绍移至 /about/。
  layout = "background"
  homepageImage = "img/home-background.svg"
  showRecent = true
  showRecentItems = 5
  showMoreLink = true
  showMoreLinkDest = "/posts/"
  cardView = false
  cardViewScreenWidth = false
  layoutBackgroundBlur = false

[article]
  showDate = true
  showDateUpdated = false
  showAuthor = true
  showBreadcrumbs = true
  showDraftLabel = true
  showEdit = false
  showHeadingAnchors = true
  showPagination = true
  invertPagination = false
  showReadingTime = true
  showTableOfContents = true
  showTaxonomies = true
  showWordCount = false
  showComments = false

[list]
  showBreadcrumbs = true
  showSummary = true
  showTableOfContents = false
  showTaxonomies = true
  groupByYear = true
  cardView = false
  cardViewScreenWidth = false

[footer]
  showAppearanceSwitcher = true
  showScrollToTop = true
